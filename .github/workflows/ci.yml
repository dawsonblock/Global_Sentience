# This is a basic workflow to help you get started with Actions

name: CI

permissions:
  contents: read

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check action schema
        run: python -m global_workspace_runtime.scripts.check_action_types

      - name: Check sentience claims
        run: python -m global_workspace_runtime.scripts.check_sentience_claims

      - name: Check no fake MV2 files
        run: python -m global_workspace_runtime.scripts.check_no_mv2 .

      - name: Check resource recovery
        run: python -m global_workspace_runtime.scripts.check_resource_recovery
